<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wakuri</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f4ed;
      color: #222;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 32px;
    }

    p {
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .release {
      margin-top: 40px;
      padding: 24px;
      background: white;
      border-radius: 12px;
    }

    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 64px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>

<body>
  <main>
    <h1>Wakuri</h1>

    <h2>日本語からプログラミングへ、橋をかける。</h2>

    <p>
      Wakuriは、日本語を入口に、
      プログラミングの概念・文法・思考法へ学習者を導くことを目指すプロジェクトです。
    </p>

    <p>
      日本語話者が、コンピューターの都合に合わせるのではなく、
      コンピューター側を人に分かる形へ近づけることを大切にしています。
    </p>

    <section class="release">
      <h2>Wakuri Language</h2>

      <p>
        日本語ネイティブな構文で学べるプログラミング言語です。
        現在、v0.1.0を公開しています。
      </p>

      <a class="button"
         href="https://github.com/wakuri-project/wakuri-language">
        GitHubで見る
      </a>
    </section>

    <footer>
      機械の理を、人が分かる形へ。<br>
      © Wakuri Project
    </footer>
  </main>
</body>
</html>
